<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭理财管家</title>
<style>
  /* ===== 墨绿暖白 · 大圆角 · 立体按钮 · 三页导航 · ECharts 看板 ===== */
  :root {
    --bg:#f6f6f4; --card:#fff; --accent:#2f5d50;
    --accent2:#4a8576; --accent3:#a3c4bb; --accent4:#d9e8e4;
    --text:#2b2b2b; --text2:#8a8a8a; --line:#eee;
    --radius:20px; --radius-s:12px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg);
         color:var(--text); line-height:1.6; padding:24px 16px 48px; }
  .wrap { max-width:600px; margin:0 auto; }
  .app-title { font-size:22px; font-weight:700; letter-spacing:1px; margin-bottom:4px; }
  .app-sub { font-size:13px; color:var(--text2); margin-bottom:24px; }

  /* 导航 */
  .nav { display:flex; gap:8px; margin-bottom:24px; background:var(--card); padding:6px;
         border-radius:var(--radius); box-shadow:0 2px 10px rgba(0,0,0,.05); }
  .nav button { flex:1; padding:12px 0; font-size:14px; font-weight:600; border:none;
        background:transparent; color:var(--text2); border-radius:var(--radius-s); cursor:pointer;
        transition:background .15s ease, color .15s ease; }
  .nav button.active { background:linear-gradient(180deg,#3a6e5f,#2f5d50); color:#fff;
        box-shadow:0 3px 8px rgba(47,93,80,.28), inset 0 1px 0 rgba(255,255,255,.22); }

  .page { display:none; }
  .page.active { display:block; }

  .total { background:var(--card); border-radius:var(--radius); padding:22px; margin-bottom:20px;
           box-shadow:0 2px 10px rgba(0,0,0,.05); display:flex; align-items:center; }
  .t-left { flex:1; }
  .t-left .label, .t-right .label { font-size:13px; color:var(--text2); }
  .t-left .num { font-size:34px; font-weight:700; margin-top:4px; }
  .t-left .num span { font-size:16px; color:var(--text2); font-weight:500; }
  .t-right { text-align:right; border-left:1px solid var(--line); padding-left:18px; }
  .t-right .income { font-size:24px; font-weight:700; color:var(--accent); margin-top:4px; }
  .t-right .ratio { font-size:12px; color:var(--text2); margin-top:2px; }

  .modules { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px; }
  .mod { background:var(--card); border-radius:var(--radius); padding:16px 18px;
         box-shadow:0 2px 10px rgba(0,0,0,.05); transition:transform .15s ease, box-shadow .15s ease; }
  .mod:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.08); }
  .m-name { font-size:14px; font-weight:600; }
  .m-name .m-pct { font-size:12px; color:var(--text2); font-weight:500; margin-left:6px; }
  .m-plan { font-size:13px; color:var(--text2); margin-top:10px; }
  .m-plan b, .m-now b { color:var(--text); font-size:16px; }
  .m-now { font-size:13px; color:var(--text2); margin-top:2px; }
  /* 预算完成度进度条 */
  .bar { height:6px; background:#eef4f2; border-radius:3px; margin-top:10px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#4a8576,#2f5d50); border-radius:3px; }
  /* 行情卡片 */
  .quote-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .quote-card { background:var(--card); border-radius:var(--radius); padding:16px 16px 6px;
                box-shadow:0 2px 10px rgba(0,0,0,.05); }
  .q-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .q-head b { font-size:14px; }
  .q-latest { font-size:17px; font-weight:700; }
  .q-latest i { font-style:normal; font-size:12px; font-weight:600; margin-left:6px; }
  .up { color:#2f9d6a; }
  .down { color:#c05b4a; }
  .q-err { font-size:12px; color:var(--text2); padding:8px 0 10px; }
  .q-mv { font-size:13px; color:var(--text2); margin-top:2px; }
  .q-mv b { font-size:18px; color:var(--text); }
  .q-pnl { font-size:12px; margin:4px 0 6px; }
  .q-pnl i { font-style:normal; font-weight:600; }
  .q-rec { font-size:12px; color:var(--text2); margin:6px 0 2px; }

  .card-title { font-size:15px; font-weight:700; margin:26px 0 12px; }
  .pie-card { background:var(--card); border-radius:var(--radius); padding:14px 14px 8px;
              box-shadow:0 2px 10px rgba(0,0,0,.05); }

  .form-card { background:var(--card); border-radius:var(--radius); padding:20px;
               box-shadow:0 2px 10px rgba(0,0,0,.05); }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:13px; color:var(--text2); margin-bottom:6px; }
  .field input, .field select { width:100%; padding:12px 14px; font-size:15px;
        border:1px solid var(--line); border-radius:var(--radius-s); background:#fafaf9; outline:none;
        transition:border-color .15s ease, background .15s ease; }
  .field input:focus { border-color:var(--accent); background:#fff; }

  .btn { width:100%; padding:14px; font-size:15px; font-weight:600; color:#fff; border:none;
         border-radius:var(--radius-s); cursor:pointer; margin-top:4px;
         background:linear-gradient(180deg,#3a6e5f,#2f5d50);
         box-shadow:0 3px 8px rgba(47,93,80,.28), inset 0 1px 0 rgba(255,255,255,.22);
         transition:transform .15s ease, box-shadow .15s ease, filter .15s ease; }
  .btn:hover { transform:scale(1.04); box-shadow:0 6px 14px rgba(47,93,80,.32), inset 0 1px 0 rgba(255,255,255,.22); }
  .btn:active { transform:scale(.98); box-shadow:0 2px 5px rgba(47,93,80,.25), inset 0 1px 0 rgba(255,255,255,.22); }

  .ledger { background:var(--card); border-radius:var(--radius); padding:6px 20px;
            box-shadow:0 2px 10px rgba(0,0,0,.05); }
  .entry { display:flex; align-items:center; padding:13px 0; border-bottom:1px solid var(--line); }
  .entry:last-child { border-bottom:none; }
  .entry .e-cat { width:38px; height:38px; border-radius:var(--radius-s); background:#eef4f2; color:var(--accent);
        display:flex; align-items:center; justify-content:center; font-size:16px; margin-right:12px; }
  .entry .e-info { flex:1; }
  .entry .e-name { font-size:14px; font-weight:600; }
  .entry .e-note { font-size:12px; color:var(--text2); }
  .entry .e-amt { font-size:16px; font-weight:700; }
  .month-bar { display:flex; gap:8px; margin-bottom:12px; }
  .month-bar button { flex:1; padding:10px 0; font-size:13px; font-weight:600; border:none;
        background:var(--card); color:var(--text2); border-radius:var(--radius-s); cursor:pointer;
        box-shadow:0 2px 8px rgba(0,0,0,.04); }
  .month-bar button.active { background:linear-gradient(180deg,#3a6e5f,#2f5d50); color:#fff; }
  .entry .del { border:none; background:#fbeae6; color:#c05b4a; font-size:12px; padding:6px 10px;
        border-radius:8px; cursor:pointer; margin-left:10px; }
  .entry .del:hover { background:#f5d9d3; }
  .entry .edit { border:none; background:#e8f0ed; color:var(--accent); font-size:12px; padding:6px 10px;
        border-radius:8px; cursor:pointer; margin-left:6px; }
  .entry .edit:hover { background:#d7e5e1; }
  .e-edit { display:flex; flex-wrap:wrap; gap:8px; padding:10px 0; width:100%; align-items:center; }
  .e-edit input, .e-edit select { padding:8px 10px; font-size:13px; border:1px solid var(--line); border-radius:8px; background:#fafaf9; outline:none; }
  .e-edit input { flex:1; min-width:70px; }
  .e-edit .save, .e-edit .cancel { padding:8px 14px; border:none; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; }
  .e-edit .save { background:linear-gradient(180deg,#3a6e5f,#2f5d50); color:#fff; }
  .e-edit .cancel { background:#eef1ef; color:var(--text2); }
  .mini-btn { padding:8px 14px; font-size:13px; font-weight:600; color:#fff; border:none; border-radius:10px;
        cursor:pointer; background:linear-gradient(180deg,#3a6e5f,#2f5d50);
        box-shadow:0 2px 6px rgba(47,93,80,.25), inset 0 1px 0 rgba(255,255,255,.2);
        transition:transform .15s ease, box-shadow .15s ease; }
  .mini-btn:hover { transform:scale(1.04); box-shadow:0 4px 10px rgba(47,93,80,.3), inset 0 1px 0 rgba(255,255,255,.2); }
  .card-title-row { display:flex; justify-content:space-between; align-items:center; }
  .cat-row { display:flex; gap:8px; }
  .cat-row select { flex:1; }
  .cat-row .mini-btn { flex:0 0 auto; }
  .cat-modal { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; z-index:50; }
  .cat-box { background:var(--card); border-radius:var(--radius); width:88%; max-width:340px; padding:20px; box-shadow:0 8px 30px rgba(0,0,0,.2); }
  .cat-head { display:flex; justify-content:space-between; align-items:center; font-size:15px; font-weight:700; margin-bottom:12px; }
  .cat-close { border:none; background:#eef1ef; color:var(--text2); width:28px; height:28px; border-radius:8px; cursor:pointer; font-size:16px; }
  .cat-item { display:flex; justify-content:space-between; align-items:center; padding:9px 12px; background:#fafaf9; border-radius:10px; margin-bottom:8px; font-size:14px; }
  .cat-item .del { padding:4px 9px; font-size:12px; }
  .cat-add { display:flex; gap:8px; margin-top:6px; }
  .cat-add input { flex:1; padding:10px 12px; font-size:14px; border:1px solid var(--line); border-radius:10px; background:#fafaf9; outline:none; }
  .login-page { position:fixed; inset:0; background:#f6f6f4; display:flex; align-items:center; justify-content:center; z-index:100; }
  .login-box { background:var(--card); border-radius:var(--radius); padding:28px 24px; width:84%; max-width:340px; box-shadow:0 8px 30px rgba(0,0,0,.12); }
  .login-logo { font-size:20px; font-weight:800; color:var(--main); text-align:center; margin-bottom:18px; }
  .login-box input { width:100%; padding:12px 14px; font-size:15px; border:1px solid var(--line); border-radius:12px; margin-bottom:10px; background:#fafaf9; outline:none; box-sizing:border-box; }
  .login-box .btn { width:100%; margin-top:2px; }
  .lg-msg { color:#c0392b; font-size:13px; min-height:18px; margin:2px 0 8px; text-align:center; }
  .lg-switch { text-align:center; margin-top:12px; font-size:13px; color:var(--text2); }
  .lg-switch a { color:var(--main); font-weight:600; cursor:pointer; }
  .topbar { display:flex; justify-content:space-between; align-items:center; padding:10px 2px 0; font-size:13px; color:var(--text2); }
  .tb-user b { color:var(--main); font-size:14px; }
  .tb-logout { border:1px solid var(--line); background:#fff; color:var(--text2); padding:6px 12px; border-radius:10px; font-size:12px; cursor:pointer; }
  .empty { text-align:center; color:var(--text2); font-size:14px; padding:28px 0; }
  .inv-actions { display:flex; gap:10px; }
  .inv-red { background:linear-gradient(180deg,#c97a63,#b05b4a); box-shadow:0 3px 8px rgba(176,91,74,.3), inset 0 1px 0 rgba(255,255,255,.2); }
  .inv-red:hover { box-shadow:0 6px 14px rgba(176,91,74,.34), inset 0 1px 0 rgba(255,255,255,.2); }

  /* ===== 手机适配（窄屏） ===== */
  @media (max-width:520px) {
    body { padding:16px 12px 52px; }
    .app-title { font-size:19px; }
    .app-sub { margin-bottom:18px; }
    .nav { gap:4px; padding:5px; }
    .nav button { font-size:12px; padding:11px 0; }
    .quote-grid { grid-template-columns:1fr; }
    .total { padding:16px; }
    .total .num { font-size:27px; }
    .modules { gap:10px; }
    .mod { padding:13px 14px; }
    .entry .e-amt { font-size:15px; }
    .pie-card { padding:10px 10px 4px; }
    .form-card { padding:16px; }
    .field input, .field select { padding:11px 12px; font-size:14px; }
    .btn { padding:13px; }
  }
</style>
</head>
<body>
<!-- 登录页（未登录时全屏遮罩，登录后隐藏） -->
<div class="login-page" id="loginPage" style="display:flex">
  <div class="login-box">
    <div class="login-logo">家庭理财</div>
    <input id="lgName" placeholder="账号">
    <input id="lgPwd" type="password" placeholder="密码">
    <div id="lgMsg" class="lg-msg"></div>
    <button class="btn" onclick="doLogin()">登录</button>
    <div class="lg-switch"><a onclick="showReg(true)">注册新账号</a></div>
    <div id="lgReg" style="display:none">
      <input id="lgPwd2" type="password" placeholder="确认密码">
      <button class="btn" onclick="doRegister()">注册并登录</button>
      <div class="lg-switch"><a onclick="showReg(false)">返回登录</a></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="app-title">家庭理财管家</div>
  <div class="app-sub">记一笔，看得清</div>
  <div class="topbar"><span class="tb-user">当前：<b id="userName">--</b></span><button class="tb-logout" onclick="logout()">退出</button></div>

  <!-- 导航 -->
  <div class="nav">
    <button id="navHome" class="active" onclick="showPage('home')">主页</button>
    <button id="navExpense" onclick="showPage('expense')">记支出</button>
    <button id="navAssets" onclick="showPage('assets')">总资产</button>
    <button id="navInvest" onclick="showPage('invest')">投资</button>
    <button id="navLedger" onclick="showPage('ledger')">最近账目</button>
  </div>

  <!-- ===== 主页：本月收支 + 看板 ===== -->
  <div class="page active" id="page-home">
    <div class="total">
      <div class="t-left">
        <div class="label">本月可用</div>
        <div class="num" id="availNum"></div>
      </div>
      <div class="t-right">
        <div class="label">本月收入</div>
        <div class="income" id="incomeNum"></div>
        <div class="ratio" id="incomeRatio"></div>
      </div>
    </div>

    <div class="card-title">预算完成度</div>
    <div class="modules" id="modulesGrid"></div>

    <div class="card-title">本月支出分布</div>
    <div class="pie-card">
      <div id="pieChart" style="width:100%;height:235px"></div>
    </div>

    <div class="card-title">近7天支出趋势</div>
    <div class="pie-card">
      <div id="trendChart" style="width:100%;height:200px"></div>
    </div>

    <div class="card-title">记一笔收入</div>
    <div class="form-card">
      <div class="field"><label>金额（元）</label><input type="number" id="incAmount" placeholder="0.00"></div>
      <div class="field"><label>分类</label>
        <div class="cat-row">
          <select id="incCategory"></select>
          <button class="mini-btn" onclick="openCatManage('income')">管理</button>
        </div>
      </div>
      <div class="field"><label>备注</label><input type="text" id="incNote" placeholder="选填，一句话"></div>
      <button class="btn" id="incBtn">记收入</button>
    </div>
  </div>

  <!-- ===== 记支出页 ===== -->
  <div class="page" id="page-expense">
    <div class="card-title">记一笔支出</div>
    <div class="form-card">
      <div class="field"><label>金额（元）</label><input type="number" id="expAmount" placeholder="0.00"></div>
      <div class="field"><label>分类</label>
        <div class="cat-row">
          <select id="expCategory"></select>
          <button class="mini-btn" onclick="openCatManage('expense')">管理</button>
        </div>
      </div>
      <div class="field"><label>备注</label><input type="text" id="expNote" placeholder="选填，一句话"></div>
      <button class="btn" id="expBtn">记支出</button>
    </div>
  </div>

  <!-- ===== 总资产页 ===== -->
  <div class="page" id="page-assets">
    <div class="total">
      <div class="t-left">
        <div class="label">总资产</div>
        <div class="num" id="assetTotal"></div>
      </div>
      <div class="t-right">
        <div class="label">资金模块</div>
        <div class="income" id="assetCount">3 个</div>
        <div class="ratio" id="assetNote">手上可用+稳健+投资</div>
      </div>
    </div>

    <div class="card-title">资金分布</div>
    <div class="modules" id="assetModules"></div>

    <div class="card-title">资产占比</div>
    <div class="pie-card">
      <div id="assetChart" style="width:100%;height:235px"></div>
    </div>

    <div class="card-title">预算分配比例</div>
    <div class="form-card">
      <div class="field"><label>应急救命 %</label><input type="number" id="bdEmer"></div>
      <div class="field"><label>稳健理财 %</label><input type="number" id="bdWen"></div>
      <div class="field"><label>个人投资 %</label><input type="number" id="bdTou"></div>
      <div class="field"><label>日常娱乐 %</label><input type="number" id="bdDaily"></div>
      <button class="btn" id="bdBtn" onclick="saveBudget()">保存比例</button>
    </div>
  </div>

  <!-- ===== 投资页 ===== -->
  <div class="page" id="page-invest">
    <div class="card-title">投资总览</div>
    <div class="quote-grid" id="invOverview"></div>

    <div class="card-title">行情走势</div>
    <div class="pie-card" style="padding:10px 14px 6px">
      <div class="quote-grid">
        <div class="quote-card"><div class="q-head"><b>稳健理财</b></div><div id="invWenwenChart" style="width:100%;height:130px"></div></div>
        <div class="quote-card"><div class="q-head"><b>个人投资</b></div><div id="invTouziChart" style="width:100%;height:130px"></div></div>
      </div>
    </div>

    <div class="card-title">投入 / 赎回</div>
    <div class="form-card">
      <div class="field"><label>模块</label>
        <select id="invModule"><option value="wenwen">稳健理财</option><option value="touzi">个人投资</option></select>
      </div>
      <div class="field"><label>金额（元）</label><input type="number" id="invAmount" placeholder="0.00"></div>
      <div class="inv-actions">
        <button class="btn" id="invAddBtn" style="width:49%">投入资金</button>
        <button class="btn inv-red" id="invSubBtn" style="width:49%">赎回</button>
      </div>
    </div>

    <div class="card-title">持仓流水</div>
    <div class="ledger" id="invRecords"></div>

    <div class="card-title">分析建议</div>
    <div class="form-card" id="invAdvice"></div>
  </div>

  <!-- ===== 最近账目页 ===== -->
  <div class="page" id="page-ledger">
    <div class="card-title card-title-row">最近账目
      <button class="mini-btn" onclick="exportCsv()">导出 CSV</button>
    </div>
    <div class="month-bar">
      <button id="mth0" class="active" onclick="setMonth(0)">本月</button>
      <button id="mth-1" onclick="setMonth(-1)">上月</button>
      <button id="mthall" onclick="setMonth('all')">全部</button>
    </div>
    <div class="ledger" id="ledgerList"></div>
  </div>

  <!-- 分类管理弹窗 -->
  <div class="cat-modal" id="catModal">
    <div class="cat-box">
      <div class="cat-head">管理分类 <button class="cat-close" onclick="closeCatManage()">×</button></div>
      <div id="catList"></div>
      <div class="cat-add">
        <input id="catNewName" placeholder="新分类名">
        <button class="mini-btn" onclick="addCategory()">添加</button>
      </div>
    </div>
  </div>
</div>

<script src="echarts.min.js"></script>
<script>
  let pieInst, trendInst, assetInst;   // ECharts 实例（切页后要 resize）
  let quoteInsts = {};   // 行情折线实例（总资产页）

  // ===== 登录 / 注册 / 退出 =====
  // 全局重写 fetch：自动带上当前登录 token（一次改动，全站请求生效）
  const _rawFetch = window.fetch.bind(window);
  window.fetch = function (url, opt) {
    opt = opt || {};
    opt.headers = Object.assign({}, opt.headers,
      { "Authorization": "Bearer " + (localStorage.getItem("ff_token") || "") });
    return _rawFetch(url, opt);
  };

  function showLogin() { document.getElementById("loginPage").style.display = "flex"; }
  function hideLogin() { document.getElementById("loginPage").style.display = "none"; }
  function showReg(show) { document.getElementById("lgReg").style.display = show ? "block" : "none"; }

  async function doLogin() {
    const name = document.getElementById("lgName").value.trim();
    const pwd = document.getElementById("lgPwd").value;
    const r = await (await fetch("/api/login", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, password: pwd }) })).json();
    if (r.ok) {
      localStorage.setItem("ff_token", r.token);
      localStorage.setItem("ff_name", r.name);
      document.getElementById("userName").textContent = r.name;
      hideLogin(); loadAll();
    } else {
      document.getElementById("lgMsg").textContent = r.msg;
    }
  }

  async function doRegister() {
    const name = document.getElementById("lgName").value.trim();
    const pwd = document.getElementById("lgPwd").value;
    const pwd2 = document.getElementById("lgPwd2").value;
    if (pwd !== pwd2) { document.getElementById("lgMsg").textContent = "两次密码不一致"; return; }
    if (pwd.length < 4) { document.getElementById("lgMsg").textContent = "密码至少 4 位"; return; }
    const r = await (await fetch("/api/register", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, password: pwd }) })).json();
    if (r.ok) {
      localStorage.setItem("ff_token", r.token);
      localStorage.setItem("ff_name", r.name);
      document.getElementById("userName").textContent = r.name;
      hideLogin(); loadAll();
    } else {
      document.getElementById("lgMsg").textContent = r.msg;
    }
  }

  function logout() {
    localStorage.removeItem("ff_token");
    localStorage.removeItem("ff_name");
    showLogin();
  }

  function loadAll() {
    loadLedger(); loadSummary(); loadTrend(); loadOverview();
    loadAssets(); loadInvest(); loadCategories(); loadBudget();
  }

  // ===== 导航切换 =====
  function showPage(name) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById("page-" + name).classList.add("active");
    document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
    document.getElementById("nav" + name[0].toUpperCase() + name.slice(1)).classList.add("active");
    setTimeout(() => { [pieInst, trendInst, assetInst, ...Object.values(quoteInsts)].forEach(i => i && i.resize()); }, 60);
  }

  // ===== 加载：最近账目（按月过滤 + 删除） =====
  let allEntries = [];      // 全部账目（保留，供过滤）
  let monthOffset = 0;      // 0本月 / -1上月 / 'all'全部

  function monthLabel(offset) {
    if (offset === "all") return null;
    const d = new Date();
    d.setMonth(d.getMonth() + offset);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }
  function setMonth(offset) {
    monthOffset = offset;
    document.querySelectorAll(".month-bar button").forEach(b => b.classList.remove("active"));
    document.getElementById("mth" + (offset === "all" ? "all" : offset)).classList.add("active");
    renderLedger();
  }
  async function loadLedger() {
    const res = await fetch("/api/entries");
    allEntries = await res.json();
    renderLedger();
  }
  function renderLedger() {
    const cur = monthLabel(monthOffset);
    const items = cur ? allEntries.filter(e => e.date.startsWith(cur)) : allEntries;
    const list = document.getElementById("ledgerList");
    list.innerHTML = "";
    for (const item of items) {
      if (editingId === item.id) {
        const sel = item.type === "income"
          ? `<select id="edType"><option value="expense">支出</option><option value="income" selected>收入</option></select>`
          : `<select id="edType"><option value="expense" selected>支出</option><option value="income">收入</option></select>`;
        list.innerHTML += `
          <div class="entry">
            <div class="e-edit">
              <input id="edDate" value="${item.date}">
              <input id="edCat" value="${item.category}">
              <input id="edAmt" type="number" value="${item.amount}">
              <input id="edNote" value="${item.note || ""}" placeholder="备注">
              ${sel}
              <button class="save" onclick="saveEdit(${item.id})">保存</button>
              <button class="cancel" onclick="cancelEdit()">取消</button>
            </div>
          </div>`;
      } else {
        const tag = item.type === "income" ? "收" : "支";
        list.innerHTML += `
          <div class="entry">
            <div class="e-cat">${item.category[0]}</div>
            <div class="e-info">
              <div class="e-name">${tag}·${item.category}</div>
              <div class="e-note">${item.date} · ${item.note || ""}</div>
            </div>
            <div class="e-amt">${tag === "收" ? "+" : ""}${item.amount}</div>
            <button class="edit" onclick="editEntry(${item.id})">编辑</button>
            <button class="del" onclick="deleteEntry(${item.id})">删除</button>
          </div>`;
      }
    }
    if (!items.length) list.innerHTML = `<div class="empty">本月暂无账目</div>`;
  }
  let editingId = null;   // 正在编辑的账目 id
  function editEntry(id) { editingId = id; renderLedger(); }
  function cancelEdit() { editingId = null; renderLedger(); }
  async function saveEdit(id) {
    const body = {
      date: document.getElementById("edDate").value,
      category: document.getElementById("edCat").value,
      amount: parseFloat(document.getElementById("edAmt").value),
      note: document.getElementById("edNote").value,
      type: document.getElementById("edType").value,
    };
    await fetch("/api/entries/" + id, { method: "PUT",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    editingId = null;
    loadLedger(); loadSummary(); loadOverview(); loadTrend(); loadAssets();
  }
  async function exportCsv() {
    const resp = await fetch("/api/export");
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "账目备份.csv";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  // ===== 分类管理（动态加载 + 自定义） =====
  let catType = "expense";
  async function loadCategories() {
    const data = await (await fetch("/api/categories")).json();
    document.getElementById("incCategory").innerHTML =
      data.income.map(c => `<option value="${c.name}">${c.name}</option>`).join("");
    document.getElementById("expCategory").innerHTML =
      data.expense.map(c => `<option value="${c.name}">${c.name}</option>`).join("");
  }
  function openCatManage(type) { catType = type; renderCatList();
    document.getElementById("catModal").style.display = "flex"; }
  function closeCatManage() { document.getElementById("catModal").style.display = "none"; }
  async function renderCatList() {
    const data = await (await fetch("/api/categories")).json();
    const list = data[catType];
    document.getElementById("catList").innerHTML = list.map(c =>
      `<div class="cat-item"><span>${c.name}</span>${c.builtin ? "" :
        `<button class="del" onclick="deleteCategory(${c.id})">删</button>`}</div>`
    ).join("") || `<div class="empty">暂无分类</div>`;
  }
  async function deleteCategory(id) {
    await fetch("/api/categories/" + id, { method: "DELETE" });
    renderCatList(); loadCategories();
  }
  async function addCategory() {
    const name = document.getElementById("catNewName").value.trim();
    if (!name) return;
    await fetch("/api/categories", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, type: catType }) });
    document.getElementById("catNewName").value = "";
    renderCatList(); loadCategories();
  }

  // ===== 预算分配比例（可调） =====
  async function loadBudget() {
    const d = await (await fetch("/api/budget")).json();
    document.getElementById("bdEmer").value = d.emergency;
    document.getElementById("bdWen").value = d.wenwen;
    document.getElementById("bdTou").value = d.touzi;
    document.getElementById("bdDaily").value = d.daily;
  }
  async function saveBudget() {
    const body = {
      emergency: Number(document.getElementById("bdEmer").value),
      wenwen: Number(document.getElementById("bdWen").value),
      touzi: Number(document.getElementById("bdTou").value),
      daily: Number(document.getElementById("bdDaily").value),
    };
    await fetch("/api/budget", { method: "PUT",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    loadOverview();
  }
  async function deleteEntry(id) {
    await fetch("/api/entries/" + id, { method: "DELETE" });
    loadLedger();
    loadSummary();
    loadOverview();
    loadTrend();
  }

  // ===== 加载：支出饼图（ECharts 环形） =====
  const PIE_COLORS = ["#2f5d50", "#4a8576", "#a3c4bb", "#d9e8e4", "#c8b6a6"];
  async function loadSummary() {
    const res = await fetch("/api/summary");
    const data = await res.json();
    if (!pieInst) pieInst = echarts.init(document.getElementById("pieChart"));
    pieInst.setOption({
      tooltip: { trigger: "item", formatter: "{b}: {c} ({d}%)" },
      legend: { bottom: 0, icon: "circle", textStyle: { color: "#8a8a8a", fontSize: 12 }, itemWidth: 10, itemHeight: 10 },
      series: [{
        type: "pie", radius: ["52%", "72%"], center: ["50%", "43%"],
        itemStyle: { borderRadius: 6, borderColor: "#fff", borderWidth: 2 },
        label: { show: false }, color: PIE_COLORS,
        data: data.categories.map(c => ({ name: c.category, value: c.amount })),
      }],
      graphic: [
        { type: "text", left: "center", top: "34%", style: { text: String(data.total), fill: "#2b2b2b", fontSize: 22, fontWeight: "bold" } },
        { type: "text", left: "center", top: "48%", style: { text: "本月支出", fill: "#8a8a8a", fontSize: 12 } },
      ],
    });
  }

  // ===== 加载：近7天支出趋势（ECharts 折线） =====
  async function loadTrend() {
    const res = await fetch("/api/trend");
    const data = await res.json();
    if (!trendInst) trendInst = echarts.init(document.getElementById("trendChart"));
    trendInst.setOption({
      tooltip: { trigger: "axis" },
      grid: { left: 40, right: 16, top: 20, bottom: 26 },
      xAxis: { type: "category", data: data.dates, axisLabel: { color: "#8a8a8a" }, axisLine: { lineStyle: { color: "#eee" } } },
      yAxis: { type: "value", axisLabel: { color: "#8a8a8a" }, splitLine: { lineStyle: { color: "#f0f0f0" } } },
      series: [{
        type: "line", data: data.amounts, smooth: true, symbol: "circle", symbolSize: 7,
        lineStyle: { color: "#2f5d50", width: 3 }, itemStyle: { color: "#2f5d50" },
        areaStyle: { color: "rgba(47,93,80,0.12)" },
      }],
    });
  }

  // ===== 加载：资金概览 + 预算完成度 =====
  async function loadOverview() {
    const res = await fetch("/api/overview");
    const data = await res.json();
    document.getElementById("availNum").innerHTML = `${data.available}<span> 元</span>`;
    document.getElementById("incomeNum").textContent = "+" + data.income;
    document.getElementById("incomeRatio").textContent = "占可用 " + Math.round(data.income / data.available * 100) + "%";

    const grid = document.getElementById("modulesGrid");
    grid.innerHTML = "";
    for (const m of data.modules) {
      const pct = m.plan > 0 ? Math.min(100, Math.round(m.current / m.plan * 100)) : 0;
      grid.innerHTML += `
        <div class="mod">
          <div class="m-name">${m.name}<span class="m-pct">${m.pct}%</span></div>
          <div class="m-plan">应分配 <b>${m.plan}</b></div>
          <div class="m-now">当前 <b>${m.current}</b></div>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </div>`;
    }
  }

  // ===== 加载：总资产 =====
  async function loadAssets() {
    const res = await fetch("/api/assets");
    const data = await res.json();
    document.getElementById("assetTotal").innerHTML = `${data.total}<span> 元</span>`;

    const grid = document.getElementById("assetModules");
    grid.innerHTML = "";
    for (const m of data.modules) {
      grid.innerHTML += `
        <div class="mod">
          <div class="m-name">${m.name}<span class="m-pct">${m.ratio}%</span></div>
          <div class="m-plan">当前 <b>${m.current}</b></div>
          <div class="m-now">占比 ${m.ratio}%</div>
        </div>`;
    }

    if (!assetInst) assetInst = echarts.init(document.getElementById("assetChart"));
    assetInst.setOption({
      tooltip: { trigger: "item", formatter: "{b}: {c} ({d}%)" },
      legend: { bottom: 0, icon: "circle", textStyle: { color: "#8a8a8a", fontSize: 12 }, itemWidth: 10, itemHeight: 10 },
      series: [{
        type: "pie", radius: ["52%", "72%"], center: ["50%", "43%"],
        itemStyle: { borderRadius: 6, borderColor: "#fff", borderWidth: 2 },
        label: { show: false }, color: PIE_COLORS,
        data: data.modules.map(m => ({ name: m.name, value: m.current })),
      }],
      graphic: [
        { type: "text", left: "center", top: "34%", style: { text: String(data.total), fill: "#2b2b2b", fontSize: 22, fontWeight: "bold" } },
        { type: "text", left: "center", top: "48%", style: { text: "总资产", fill: "#8a8a8a", fontSize: 12 } },
      ],
    });
  }

  // ===== 投资页：总览 + 走势 + 流水 + 分析 =====
  async function loadInvest() {
    const [qRes, iRes] = await Promise.all([fetch("/api/quotes"), fetch("/api/invest")]);
    const q = await qRes.json();
    const inv = await iRes.json();

    // ① 投资总览卡（本金/市值/总盈亏/单日盈亏）
    const ov = document.getElementById("invOverview");
    ov.innerHTML = "";
    for (const key of ["wenwen", "touzi"]) {
      const d = q[key];
      const m = inv.modules[key];
      if (!d || d.error) { ov.innerHTML += `<div class="quote-card"><div class="q-head"><b>${m.name}</b></div><div class="q-err">行情暂不可用</div></div>`; continue; }
      const pcls = d.total_pnl >= 0 ? "up" : "down";
      const dcls = d.day_pnl >= 0 ? "up" : "down";
      ov.innerHTML += `
        <div class="quote-card">
          <div class="q-head"><b>${m.name}</b><span class="q-latest">市值 ${d.market_value} 元</span></div>
          <div class="q-pnl">本金 ${m.principal} · 总盈亏 <i class="${pcls}">${d.total_pnl >= 0 ? "+" : ""}${d.total_pnl}</i> · 单日 <i class="${dcls}">${d.day_pnl >= 0 ? "+" : ""}${d.day_pnl}</i></div>
          <div class="q-rec">区间 ${d.change >= 0 ? "+" : ""}${d.change}% · 更新 ${d.cached_at}</div>
        </div>`;
    }

    // ② 行情走势
    for (const [key, chartId] of [["wenwen", "invWenwenChart"], ["touzi", "invTouziChart"]]) {
      const d = q[key];
      const inst = echarts.init(document.getElementById(chartId));
      quoteInsts[chartId] = inst;
      inst.setOption({
        grid: { left: 42, right: 8, top: 10, bottom: 22 },
        xAxis: { type: "category", data: d.error ? [] : d.dates, show: false },
        yAxis: { type: "value", axisLabel: { color: "#aaa", fontSize: 10 }, splitLine: { lineStyle: { color: "#f0f0f0" } } },
        series: [{ type: "line", data: d.error ? [] : d.values, smooth: true, symbol: "none",
                   lineStyle: { color: key === "touzi" ? "#2f5d50" : "#a3c4bb", width: 2 } }],
      });
    }

    // ③ 持仓流水
    const rec = document.getElementById("invRecords");
    rec.innerHTML = "";
    if (!inv.records.length) rec.innerHTML = `<div class="empty">暂无投入，点"投入资金"开始记账</div>`;
    for (const r of inv.records) {
      const name = r.module === "wenwen" ? "稳健理财" : "个人投资";
      const op = r.action === "add" ? "投入" : "赎回";
      rec.innerHTML += `
        <div class="entry">
          <div class="e-cat">${r.action === "add" ? "投" : "赎"}</div>
          <div class="e-info">
            <div class="e-name">${op}·${name}</div>
            <div class="e-note">${r.date}</div>
          </div>
          <div class="e-amt">${r.action === "add" ? "+" : "-"}${r.amount}</div>
        </div>`;
    }

    // ④ 分析建议
    const w = q["wenwen"], t = q["touzi"];
    let advice = "";
    if (w && !w.error) advice += `<p>· 稳健理财（国债指数）近30日 ${w.change >= 0 ? "稳中有升 (+" + w.change + "%)" : w.change + "%"}，波动小，适合长期打底</p>`;
    if (t && !t.error) advice += `<p>· 个人投资（沪深300）近30日 ${t.change >= 0 ? "走高 (+" + t.change + "%)" : "回调 (" + t.change + "%)"}，${t.change >= 0 ? "注意止盈与回调风险" : "可分批布局、摊低成本"}</p>`;
    advice += `<p style="color:var(--text2);font-size:12px">· 净值取自东方财富真实行情，仅供参考，不构成投资建议</p>`;
    document.getElementById("invAdvice").innerHTML = advice;
  }

  // 投入 / 赎回
  async function doInvest(action) {
    const module = document.getElementById("invModule").value;
    const amount = Number(document.getElementById("invAmount").value) || 0;
    if (amount <= 0) { alert("请输入金额"); return; }
    await fetch("/api/invest", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ module, action, amount }),
    });
    document.getElementById("invAmount").value = "";
    loadInvest();
    loadOverview();   // 投入/赎回 → 主页可用资金联动
    loadAssets();     // 投入/赎回 → 总资产联动
  }
  document.getElementById("invAddBtn").onclick = () => doInvest("add");
  document.getElementById("invSubBtn").onclick = () => doInvest("remove");

  // ===== 记收入 =====
  async function addIncome() {
    const amount = document.getElementById("incAmount").value;
    const category = document.getElementById("incCategory").value;
    const note = document.getElementById("incNote").value;
    const today = new Date().toISOString().slice(0, 10);
    const res = await fetch("/api/entries", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date: today, category, amount: Number(amount), note, type: "income" }),
    });
    await res.json();
    loadOverview();
    document.getElementById("incAmount").value = "";
  }
  document.getElementById("incBtn").onclick = addIncome;

  // ===== 记支出 =====
  async function addExpense() {
    const amount = document.getElementById("expAmount").value;
    const category = document.getElementById("expCategory").value;
    const note = document.getElementById("expNote").value;
    const today = new Date().toISOString().slice(0, 10);
    const res = await fetch("/api/entries", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date: today, category, amount: Number(amount), note, type: "expense" }),
    });
    await res.json();
    loadLedger();
    loadSummary();
    loadTrend();
    document.getElementById("expAmount").value = "";
  }
  document.getElementById("expBtn").onclick = addExpense;

  // 首次加载：有 token 直接进主界面并加载数据，否则显示登录页
  if (localStorage.getItem("ff_token")) {
    document.getElementById("userName").textContent = localStorage.getItem("ff_name") || "";
    hideLogin();
    loadAll();
  } else {
    showLogin();
  }
</script>
</body>
</html>
