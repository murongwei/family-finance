<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭理财管家 · C 黑白极简</title>
<style>
  /* ===== 风格C：黑白极简（最现代） ===== */
  :root {
    --bg:#fff; --card:#fff; --accent:#111;
    --accent2:#555; --accent3:#999; --accent4:#ddd;
    --text:#111; --text2:#888; --line:#e5e5e5;
    --shadow:none;
    --catbg:#f5f5f5; --inputbg:#fff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg);
         color:var(--text); line-height:1.6; padding:24px 16px 48px; }
  .wrap { max-width:600px; margin:0 auto; }
  .app-title { font-size:22px; font-weight:700; letter-spacing:1px; margin-bottom:4px; }
  .app-sub { font-size:13px; color:var(--text2); margin-bottom:24px; }

  .total { background:var(--card); border-radius:16px; padding:22px; margin-bottom:20px;
           border:1px solid var(--line); display:flex; align-items:center; }
  .t-left { flex:1; }
  .t-left .label, .t-right .label { font-size:13px; color:var(--text2); }
  .t-left .num { font-size:34px; font-weight:700; margin-top:4px; }
  .t-left .num span { font-size:16px; color:var(--text2); font-weight:500; }
  .t-right { text-align:right; border-left:1px solid var(--line); padding-left:18px; }
  .t-right .income { font-size:24px; font-weight:700; color:var(--text); margin-top:4px; }
  .t-right .ratio { font-size:12px; color:var(--text2); margin-top:2px; }

  .modules { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  .mod { background:var(--card); border-radius:14px; padding:15px 16px; border:1px solid var(--line); }
  .m-name { font-size:14px; font-weight:600; }
  .m-name .m-pct { font-size:12px; color:var(--text2); font-weight:500; margin-left:6px; }
  .m-plan { font-size:13px; color:var(--text2); margin-top:10px; }
  .m-plan b, .m-now b { color:var(--text); font-size:16px; }
  .m-now { font-size:13px; color:var(--text2); margin-top:2px; }

  .card-title { font-size:15px; font-weight:700; margin:26px 0 12px; }
  .pie-card { background:var(--card); border-radius:16px; padding:20px; border:1px solid var(--line); }
  .pie-row { display:flex; align-items:center; gap:20px; }
  .pie-legend { flex:1; }
  .legend-item { display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:8px; }
  .legend-item .dot { width:10px; height:10px; border-radius:3px; }
  .legend-item .amt { margin-left:auto; color:var(--text2); }

  .form-card { background:var(--card); border-radius:16px; padding:20px; border:1px solid var(--line); }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:13px; color:var(--text2); margin-bottom:6px; }
  .field input, .field select { width:100%; padding:12px 14px; font-size:15px;
        border:1px solid var(--line); border-radius:10px; background:var(--inputbg); outline:none; }
  .field input:focus { border-color:#000; }
  .btn { width:100%; padding:13px; font-size:15px; font-weight:600; background:#111;
         color:#fff; border:none; border-radius:10px; cursor:pointer; margin-top:4px; }
  .ledger { background:var(--card); border-radius:16px; padding:6px 20px; border:1px solid var(--line); }
  .entry { display:flex; align-items:center; padding:13px 0; border-bottom:1px solid var(--line); }
  .entry:last-child { border-bottom:none; }
  .entry .e-cat { width:36px; height:36px; border-radius:10px; background:var(--catbg); color:var(--text);
        display:flex; align-items:center; justify-content:center; font-size:16px; margin-right:12px; }
  .entry .e-info { flex:1; }
  .entry .e-name { font-size:14px; font-weight:600; }
  .entry .e-note { font-size:12px; color:var(--text2); }
  .entry .e-amt { font-size:16px; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-title">家庭理财管家</div>
  <div class="app-sub">记一笔，看得清</div>

  <div class="total">
    <div class="t-left">
      <div class="label">本月可用</div>
      <div class="num">6,400<span> 元</span></div>
    </div>
    <div class="t-right">
      <div class="label">本月收入</div>
      <div class="income">+3,000</div>
      <div class="ratio">占可用 47%</div>
    </div>
  </div>

  <div class="modules">
    <div class="mod">
      <div class="m-name">应急救命<span class="m-pct">30%</span></div>
      <div class="m-plan">应分配 <b>1,920</b></div>
      <div class="m-now">当前 <b>2,000</b></div>
    </div>
    <div class="mod">
      <div class="m-name">稳健理财<span class="m-pct">30%</span></div>
      <div class="m-plan">应分配 <b>1,920</b></div>
      <div class="m-now">当前 <b>1,900</b></div>
    </div>
    <div class="mod">
      <div class="m-name">个人投资<span class="m-pct">30%</span></div>
      <div class="m-plan">应分配 <b>1,920</b></div>
      <div class="m-now">当前 <b>1,800</b></div>
    </div>
    <div class="mod">
      <div class="m-name">日常娱乐<span class="m-pct">10%</span></div>
      <div class="m-plan">应分配 <b>640</b></div>
      <div class="m-now">当前 <b>700</b></div>
    </div>
  </div>

  <div class="card-title">本月支出分布</div>
  <div class="pie-card">
    <div class="pie-row">
      <svg width="150" height="150" viewBox="0 0 42 42" style="flex-shrink:0">
        <circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--accent)" stroke-width="7" stroke-dasharray="18 100"/>
        <circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--accent2)" stroke-width="7" stroke-dasharray="12 100" stroke-dashoffset="-20"/>
        <circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--accent3)" stroke-width="7" stroke-dasharray="8 100" stroke-dashoffset="-35"/>
        <circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--accent4)" stroke-width="7" stroke-dasharray="6 100" stroke-dashoffset="-45"/>
        <text x="21" y="23" text-anchor="middle" font-size="5" fill="var(--text)" font-weight="700">1,240</text>
        <text x="21" y="28" text-anchor="middle" font-size="3" fill="var(--text2)">本月支出</text>
      </svg>
      <div class="pie-legend">
        <div class="legend-item"><span class="dot" style="background:var(--accent)"></span>饮食<span class="amt">430</span></div>
        <div class="legend-item"><span class="dot" style="background:var(--accent2)"></span>住房<span class="amt">300</span></div>
        <div class="legend-item"><span class="dot" style="background:var(--accent3)"></span>交通<span class="amt">210</span></div>
        <div class="legend-item"><span class="dot" style="background:var(--accent4)"></span>其他<span class="amt">300</span></div>
      </div>
    </div>
  </div>

  <div class="card-title">记一笔</div>
  <div class="form-card">
    <div class="field"><label>金额（元）</label><input type="number" placeholder="0.00"></div>
    <div class="field"><label>分类</label>
      <select><option>饮食</option><option>交通</option><option>住房</option><option>购物</option><option>医疗</option><option>其他</option></select>
    </div>
    <div class="field"><label>备注</label><input type="text" placeholder="选填，一句话"></div>
    <button class="btn">记下来</button>
  </div>

  <div class="card-title">最近账目</div>
  <div class="ledger">
    <div class="entry"><div class="e-cat">餐</div><div class="e-info"><div class="e-name">饮食</div><div class="e-note">11-04 · 午餐</div></div><div class="e-amt">30</div></div>
    <div class="entry"><div class="e-cat">行</div><div class="e-info"><div class="e-name">交通</div><div class="e-note">11-03 · 地铁</div></div><div class="e-amt">12</div></div>
  </div>
</div>
</body>
</html>
